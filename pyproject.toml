[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-data-api"
version = "0.1.0"
description = "Reusable multi-brand YouTube Data API kit (Desktop OAuth + Unlisted upload/metadata)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rudy Ellis" }]
dependencies = [
  "google-api-python-client>=2.120.0",
  "google-auth>=2.28.0",
  "google-auth-oauthlib>=1.2.0",
  "google-auth-httplib2>=0.2.0",
  "PyYAML>=6.0.1",
  "click>=8.1.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
youtube-data-api = "youtube_data_api.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
youtube_data_api = ["py.typed"]
