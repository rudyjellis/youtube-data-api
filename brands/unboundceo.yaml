# Unbound CEO — first production brand instance.
# Secret *values* live in Doppler. This file stores names only.

brand_id: unboundceo
display_name: Unbound CEO
channel_id: UCwt4BI86Ovzi0EUtv0cs--w

# GCP / OAuth context (see docs/setup-oauth.md)
gcp_project: diger-youtube
oauth_client_type: desktop
# Test user on the OAuth consent screen (Testing mode): ops@digerstudios.com

doppler:
  project: diger-youtube
  config: unboundceo

# Doppler secret *names* (not values)
secrets:
  client_id: YOUTUBE_OAUTH_CLIENT_ID
  client_secret: YOUTUBE_OAUTH_CLIENT_SECRET
  refresh_token: YOUTUBE_OAUTH_REFRESH_TOKEN

defaults:
  # Kit never auto-Public. Uploads default to Unlisted.
  privacy_status: unlisted
  category_id: "22"  # People & Blogs
  made_for_kids: false
  notify_subscribers: false

token_cache: tokens/unboundceo.token.json
